services:
  web:
    build:
      context: .
      args:
        # Build args fall back to Dockerfile placeholders when unset, so the
        # build succeeds even without these vars. Real runtime values come
        # from env_file below.
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}
    ports:
      - "3000:3000"
    env_file:
      - .env.local
    restart: unless-stopped
